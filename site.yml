---
- name: Provision the tradelive VM
  hosts: tradelive
  become: yes

  vars_files:
    - vars/secrets.yml

  tasks:
    - name: Install password quality package
      apt:
        name: libpam-pwquality
        state: present
        update_cache: yes

    - name: Enforce strong password policy
      lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?minlen'
        line: 'minlen = 12'

    - name: Ensure developers group exists
      group:
        name: developers
        state: present

    - name: Create trader user
      user:
        name: trader
        group: developers
        shell: /bin/bash
        create_home: yes

    - name: Set trader password
      user:
        name: trader
        password: "{{ trader_hash }}"

    - name: Install trader SSH public key
      authorized_key:
        user: trader
        key: "{{ trader_ssh_public_key }}"
        state: present

    # Experiment 7 - Two Factor Authentication

    - name: Install the Google Authenticator PAM module
      apt:
        name: libpam-google-authenticator
        update_cache: yes
        state: present

    - name: Tell PAM to use Google Authenticator for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        line: "auth required pam_google_authenticator.so nullok"
        state: present
      notify: Restart SSH

    - name: Turn off PAM password logins for SSH
      lineinfile:
        path: /etc/pam.d/sshd
        regexp: '^@include common-auth'
        line: "#@include common-auth"
      notify: Restart SSH

    - name: Allow keyboard-interactive logins
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: "KbdInteractiveAuthentication yes"
      notify: Restart SSH

    - name: Require key AND code for trader only
      blockinfile:
        path: /etc/ssh/sshd_config
        marker: "# {mark} TRADER 2FA"
        block: |
          Match User trader
            AuthenticationMethods publickey,keyboard-interactive
      notify: Restart SSH

    - name: Configure limited sudo access for trader
      copy:
        dest: /etc/sudoers.d/trader-limited
        content: |
          trader ALL=(root) NOPASSWD: /usr/bin/systemctl status ssh, /usr/bin/systemctl restart ssh, /usr/bin/apt update
        owner: root
        group: root
        mode: '0440'
        validate: '/usr/sbin/visudo -cf %s'

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
